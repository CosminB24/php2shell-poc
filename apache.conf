# php2shell: single-worker prefork, no keep-alive (exact 3em0 reference).
# Mounted at /etc/apache2/conf-enabled/zz-php2shell.conf, so it loads AFTER
# mods-enabled/mpm_prefork.conf and overrides its values.
KeepAlive Off

<IfModule mpm_prefork_module>
    StartServers           1
    MinSpareServers        1
    MaxSpareServers        1
    MaxRequestWorkers      1
    ServerLimit            1
    MaxConnectionsPerChild 0
</IfModule>
