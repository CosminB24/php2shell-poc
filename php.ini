; php2shell lab settings - EXACT match with the 3em0 reference (docker/php.ini).
; Mounted at /usr/local/etc/php/php.ini (replaces any old php.ini).
; Do NOT change memory_limit / expose_php / post_max_size without recalibrating
; the stage-3 heap grooming: the Zend MM layout depends on them.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

memory_limit = 8M
post_max_size = 64M
upload_max_filesize = 64M

session.save_path = "/tmp"
session.use_strict_mode = 0
session.use_cookies = 1
session.upload_progress.enabled = On
session.upload_progress.cleanup = On
